<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deo IA V6 FIXED</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;margin:0}
.header{background:#1e293b;padding:15px;text-align:center;position:sticky;top:0}
.bubble{max-width:85%;margin:10px;padding:12px 15px;border-radius:18px;line-height:1.5;white-space:pre-wrap}
.bot{background:#334155}
.user{background:#2563eb;margin-left:auto;text-align:right}
#chat{display:flex;flex-direction:column;padding:15px;padding-bottom:100px;min-height:70vh}
#inputBar{position:fixed;bottom:0;left:0;right:0;background:#1e293b;padding:10px;display:flex;gap:8px}
input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
button{background:#2563eb;color:white;border:none;padding:12px 20px;border-radius:25px;font-weight:bold}
.tag{background:#0f172a;border:1px solid #334155;padding:6px 12px;border-radius:20px;margin:3px;display:inline-block;font-size:13px}
</style>
</head>
<body>
<div class="header">
<b>Deo IA V6 FIXED ✅</b><br>
<small>RDC / Mines / ONEM / Cours</small><br>
<div style="margin-top:8px">
<span class="tag" onclick="ask('impot gaston jeze')">Impôt Jèze</span>
<span class="tag" onclick="ask('budget')">Budget</span>
<span class="tag" onclick="ask('guerre rdc')">Guerre RDC</span>
<span class="tag" onclick="ask('onem')">ONEM</span>
<span class="tag" onclick="ask('contrats miniers')">Contrats</span>
</div>
</div>
<div id="chat">
<div class="bubble bot">Mbote Deo ! V6 Réparée ✅ Plus d'erreur réseau !

Clique un bouton ou pose ta question. Je réponds direct, même sans internet.

Ex: Tape "Définition impôt Gaston Jèze"</div>
</div>
<div id="inputBar">
<input id="q" placeholder="Pose ta question..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Envoyer</button>
</div>
<script>
function getAns(q){
 q=q.toLowerCase();
 if(q.includes("impot") || q.includes("gaston") || q.includes("jeze")){
  return "DÉFINITION IMPÔT - GASTON JÈZE (1922):\n\n\"L'impôt est une prestation pécuniaire requise des particuliers par voie d'autorité, à titre définitif et sans contrepartie, en vue de la couverture des charges publiques.\"\n\n5 ELEMENTS:\n1. Prestation pécuniaire (argent)\n2. Voie d'autorité (obligatoire)\n3. Définitif (non remboursable)\n4. Sans contrepartie directe\n5. Pour charges publiques\n\nC'est la définition de référence en droit fiscal L2 RDC.";
 }
 if(q.includes("budget")){
  return "BUDGET:\n\nActe par lequel sont prévues et autorisées les recettes et dépenses annuelles de l'Etat.\n\nCaractères: Prévision, Autorisation, Annuel.\nPrincipes: Annualité, Unité, Universalité, Spécialité.\nTypes: Budget général, annexes, comptes spéciaux.";
 }
 if(q.includes("guerre") || q.includes("rdc") || q.includes("rubaya") || q.includes("goma")){
  return "GUERRE RDC OCT 2026:\n\nZone: Est, Nord-Kivu (Rubaya, Goma)\nEnjeu: Coltan - plus grand gisement mondial\nActeurs: FARDC, M23\nImpact: Crise humanitaire, enjeu USA-Chine minerais stratégiques.";
 }
 if(q.includes("contrat") || q.includes("minier") || q.includes("usa") || q.includes("chine")){
  return "CONTRATS MINIERS:\n\nUSA: Transparence, corridor Lobito, traçabilité.\nChine: Infrastructures contre minerais (Sicomines), 68% cobalt.\nCode minier 2018: Plus de revenus pour l'Etat.";
 }
 if(q.includes("onem") || q.includes("emploi") || q.includes("mikuba")){
  return "EMPLOI RDC:\n\nONEM.cd: Office National Emploi. Inscription gratuite, offres mines.\nMikuba: Plateforme privée.\nConseil: Dépose CV ONEM Gombe + en ligne.";
 }
 return "Tu as demandé: "+q+"\n\nJe connais: impôt Jèze, budget, guerre RDC, contrats miniers, ONEM.\nTape par ex: 'impôt gaston jeze'";
}
function add(t,c){const ch=document.getElementById('chat');const d=document.createElement('div');d.className='bubble '+c;d.innerText=t;ch.appendChild(d);window.scrollTo(0,document.body.scrollHeight);}
function send(){const i=document.getElementById('q');const q=i.value.trim();if(!q)return;add(q,'user');i.value='';setTimeout(()=>{add(getAns(q),'bot')},300);}
function ask(t){document.getElementById('q').value=t;send();}
</script>
</body>
 </html>
