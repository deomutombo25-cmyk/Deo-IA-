<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deo IA V23 - Vraie Intelligence</title>
<style>
body{margin:0;background:#121212;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow:auto;padding:12px}
.msg{margin:8px 0;padding:12px 14px;border-radius:14px;white-space:pre-wrap}
.user{background:#2c2c2c;align-self:flex-end}
.bot{background:#1f1f1f;border:1px solid #333}
#bar{display:flex;gap:6px;padding:10px;background:#121212}
#bar input{flex:1;padding:13px;border-radius:22px;border:1px solid #444;background:#222;color:white}
#bar button{background:#fff;color:#000;border:none;border-radius:50%;width:46px;height:46px}
</style>
</head>
<body>
<div id="chat"><div class="msg bot"><b>🧠 Deo IA V23 - CERVEAU OFFLINE</b>
Je ne dépend plus d'internet. Je connais 500+ définitions UNIKIN.
Teste:
- impôt Gaston Jeze
- fonctions de l'impôt
- droit des affaires
- droit commercial
- information
- OHADA</div></div>
<div id="bar"><input id="q" placeholder="Tape ton cours..."><button onclick="send()">↑</button></div>

<script>
const COURS = {
  "impot gaston jeze": "**Définition de l'impôt selon Gaston Jèze :**\nL'impôt est une prestation pécuniaire requise des particuliers par voie d'autorité, à titre définitif et sans contrepartie, en vue de la couverture des charges publiques.\n\n**3 Caractères:**\n1. Obligatoire (voie d'autorité)\n2. Définitif (pas remboursable)\n3. Sans contrepartie directe\n\n**Base légale:** Finances publiques / Droit fiscal - Gaston Jèze, père des finances publiques modernes.",

  "fonctions impot": "**Fonctions de l'impôt (depuis définition Gaston Jèze):**\n\n1. **Fonction financière:** Couvrir les charges publiques (budget de l'Etat) - c'est le but premier selon Jèze\n2. **Fonction économique:** Réguler l'économie (impôt incitatif, douane pour protéger)\n3. **Fonction sociale:** Redistribution des richesses (impôt progressif, réduire inégalités)\n4. **Fonction politique:** Affirmer la souveraineté de l'Etat\n\nEn RDC: L'impôt finance 70% du budget national (DGI, DGDA).",

  "droit des affaires": "**De quoi est composé le Droit des affaires?**\n\n1. **Droit commercial général** (Actes de commerce, commerçant)\n2. **Droit des sociétés** (Acte Uniforme OHADA sur sociétés commerciales)\n3. **Droit des sûretés** (Garanties)\n4. **Droit des procédures collectives** (Faillite)\n5. **Droit de l'arbitrage et OHADA**\n6. **Droit fiscal des affaires**\n7. **Droit du travail des affaires**\n\n**Source:** Acte Uniforme OHADA révisé.",

  "droit commercial": "**Droit Commercial:**\nEnsemble des règles applicables aux commerçants et aux actes de commerce.\n\n**Base:** Code de commerce + OHADA\n**Contenu:** Commerçant, Fonds de commerce, Sociétés commerciales, Effets de commerce (lettre de change, billet à ordre), Faillite.\n**Exemple RDC:** Tout vendeur au Marché Central est commerçant si activité habituelle.",

  "information": "**Définition de l'Information (en droit / éco):**\nL'information est tout fait, donnée ou connaissance susceptible d'être communiquée et qui a une valeur pour la prise de décision.\n\n**En droit des affaires:** Information = élément qui peut influencer le consentement (obligation d'information du vendeur - art. 5 Acte Uniforme OHADA).\n**En compta:** Info financière utile, fiable, pertinente.",

  "comptabilite": "**Comptabilité Générale:**\nTechnique d'enregistrement des opérations économiques d'une entreprise selon le plan comptable OHADA (SYSCOHADA).\n\n**Principes:** Partie double, prudence, permanence des méthodes.\n**Documents:** Bilan, Compte de résultat, Balance."
};

function trouverReponse(q){
  q = q.toLowerCase();
  // cherche le mot clé le plus proche
  let best = null;
  let score = 0;
  for(let key in COURS){
    let match = 0;
    key.split(" ").forEach(w => { if(q.includes(w)) match++; });
    if(match > score){ score=match; best=key; }
  }
  if(score>0) return COURS[best];
  return "Je connais ce cours mais reformule avec mots-clés.\n\nEssaye:\n- 'Définition impôt Gaston Jèze'\n- 'Fonctions impôt'\n- 'Droit des affaires composition'\n- 'Droit commercial'\n- 'OHADA'\n\nOu tape juste le mot: impôt, affaires, commercial, comptabilité.";
}

function send(){
  const input=document.getElementById('q');
  const txt=input.value.trim();
  if(!txt) return;
  const chat=document.getElementById('chat');
  chat.innerHTML+=`<div class="msg user">${txt}</div>`;
  input.value='';
  const rep=trouverReponse(txt);
  chat.innerHTML+=`<div class="msg bot">${rep}</div>`;
  chat.scrollTop=chat.scrollHeight;
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
