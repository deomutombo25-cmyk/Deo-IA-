<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deo IA V33 - Définition Informatique OK</title>
<style>
body{margin:0;background:#0a0a0a;color:#eee;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:13px;border-radius:16px;white-space:pre-wrap;line-height:1.6;font-size:14px}
.user{background:#2a2a2a;align-self:flex-end}
.bot{background:#181818;border:1px solid #2a2a2a;align-self:flex-start}
.badge{font-size:10px;padding:3px 8px;border-radius:10px;background:#00e676;color:#000}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid #222}
#bar input{flex:1;padding:14px;border-radius:24px;border:1px solid #444;background:#1e1e1e;color:white}
#bar button{background:#fff;color:#000;border:none;border-radius:50%;width:48px;height:48px}
</style>
</head>
<body>
<div id="chat"><div class="msg bot"><span class="badge">V33 - DÉFINITION INFORMATIQUE CORRIGÉE</span>
<b>Maintenant définition informatique générale OK!</b>

Tape: informatique -> définition générale
Tape: informatique de gestion -> version ISC

Teste aussi: bureautique, algorithme, internet, base de données
</div></div>
<div id="bar"><input id="q" placeholder="Ex: définition informatique..."><button onclick="send()">↑</button></div>
<script>
const DICT = {
// PRIORITÉ 1 - DÉFINITIONS GÉNÉRALES (placées en haut)
"informatique": "**Informatique - Définition Générale:** Science du traitement automatique de l'information par ordinateur. Terme créé en 1962 par Philippe Dreyfus (INFORmation + autoMATIQUE).\n\n**Objectif:** Traiter, stocker, transmettre l'information.\n\n**2 parties:**\n1. Hardware (matériel): UC, écran, clavier, disque dur\n2. Software (logiciels): Windows, Word, Excel, Sage\n\n**4 branches:** Programmation, Réseaux, Base de données, Intelligence Artificielle.\n\n**En RDC:** Utilisée à DGI, DGDA, banques, UNIKIN, ISC, écoles. Indispensable pour comptabilité informatisée.",
"bureautique": "**Bureautique:** Ensemble techniques pour automatiser travail de bureau. Logiciels: Word (traitement texte), Excel (tableur calculs), PowerPoint (présentation), Access (base données). Suite Microsoft Office. Essentiel pour secrétariat ISC et comptabilité.",
"algorithme": "**Algorithme:** Suite d'instructions logiques pour résoudre problème. Ex: recette cuisine, mode d'emploi. En informatique: début -> instructions -> fin. Caractéristiques: fini, précis, entrée/sortie. Exemple: algorithme calcul moyenne notes ISC.",
"internet": "**Internet:** Réseau mondial interconnectant millions d'ordinateurs. Services: Web (sites), Email, Réseaux sociaux. Protocoles: HTTP, TCP/IP. En RDC: fournisseurs Orange, Vodacom, Airtel 4G. Utilité: recherche, commerce en ligne, formation.",
"base de donnees": "**Base de Données:** Ensemble organisé d'informations stockées. Ex: liste étudiants ISC, clients boutique. Logiciels: Access, MySQL, SQL Server, Oracle. Modélisation Merise: MCD (Modèle Conceptuel Données), MLD. Langage: SQL (SELECT, INSERT).",

// ISC
"informatique de gestion": "**Informatique de Gestion (ISC IG):** Section ISC. Cours: Algorithme, Programmation (VB, C#, Java, Python), Base données (Access, SQL Server, MySQL), Réseaux, Analyse Merise (MCD, MLD), Gestion projet, Sage Compta. Débouchés: analyste programmeur, admin BD, DSI Kinshasa. Diplôme: Graduat + Licence.",
"isc": "**ISC:** Institut Supérieur de Commerce. Sections: Compta, Gestion, Commerce International, Douane, Marketing, Informatique Gestion, Secrétariat. Graduat 3 ans + Licence 2 ans. Fondé 1962.",
"incoterms": "**Incoterms 2020:** 11 règles vente internationale. Groupes: E EXW, F FOB FCA, C CFR CIF, D DAP DDP. RDC: FOB port Matadi, CIF avec assurance.",
"douane": "**Douane DGDA:** Perçoit droits douane RDC. Régimes: import, export, transit, entrepôt. Droits DD 5-20% + TVA 16%. Corridors Matadi-Kinshasa, Dar, Lobito.",
"commerce international": "**Commerce International:** Echanges entre pays. Ricardo avantage comparatif, Smith avantage absolu. Balance = Export - Import. RDC export cuivre/cobalt.",
"audit": "**Audit:** Contrôle indépendant comptes pour certifier. Types: financier (commissaire), interne, opérationnel. Normes ISA, ONEC RDC.",
"controle gestion": "**Contrôle Gestion:** Pilote performance. Outils: budget, tableau bord, ABC, seuil rentabilité, balanced scorecard.",
"marketing mix": "**Marketing Mix 4P:** Produit, Prix, Place, Promotion + Personnel Processus Preuve. Segmentation, ciblage.",
"tva": "**TVA RDC 16%** depuis 2012. HT*0.16=TVA, TTC=HT+TVA. Collectée entreprises, reversée DGI.",
"comptabilite ohada": "**Compta OHADA SYSCOHADA:** Bilan, Compte résultat, Flux trésorerie. Partie double, 8 classes. Logiciels Sage, SAP.",

// SECONDAIRE + UNIKIN
"photosynthese": "**Photosynthèse:** 6CO2+6H2O+lumière -> C6H12O6+6O2. Chloroplaste, chlorophylle.",
"pythagore": "**Pythagore:** c²=a²+b² triangle rectangle. Ex 3-4-5.",
"cellule": "**Cellule:** Unité vie. Membrane, cytoplasme, noyau, mitochondrie énergie.",
"adn": "**ADN:** Double hélice A-T C-G, 46 chromosomes, info génétique.",
"independance": "**Indépendance RDC 30 juin 1960:** Lumumba discours, Kasa-Vubu, fin colonisation belge 1885-1960.",
"impot gaston": "**Impôt Gaston Jèze:** Prestation pécuniaire par autorité, définitive, sans contrepartie, charges publiques.",
"ohada": "**OHADA:** 17 pays, 10 Actes Uniformes, RDC 2012."
};

function smart(q){
 q=q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 // Si question exacte "informatique" seule, donne définition générale
 if(q.trim()==="informatique" || q.includes("definition de l'informatique") || q.includes("c est quoi l'informatique")) return DICT["informatique"];
 // Sinon cherche le plus précis d'abord (longueur clé)
 let keys = Object.keys(DICT).sort((a,b)=>b.length-a.length);
 for(let k of keys){ if(q.includes(k)) return DICT[k]; }
 return null;
}
function calc(q){
 let l=q.toLowerCase();
 if(l.includes("tva")){ let n=q.match(/\d+/g); if(n){ let ht=parseInt(n[0]); return `**TVA 16%** HT ${ht} => TVA ${ht*0.16} => TTC ${ht*1.16} FC`; } }
 return null;
}
function send(){
 const inp=document.getElementById('q'); const txt=inp.value.trim(); if(!txt) return;
 const chat=document.getElementById('chat');
 chat.innerHTML+=`<div class="msg user">${txt}</div>`; inp.value='';
 const id='a'+Date.now(); chat.innerHTML+=`<div class="msg bot" id="${id}">...</div>`;
 setTimeout(()=>{
   let r=calc(txt)||smart(txt);
   document.getElementById(id).innerHTML=r?`<span class="badge">V33 - Réponse</span><br>${r}`:`<span class="badge">Aide</span><br>Essaie: informatique, bureautique, algorithme, internet, base de données, incoterms, douane, audit`;
   chat.scrollTop=chat.scrollHeight;
 },100);
 chat.scrollTop=chat.scrollHeight;
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
