<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deo IA V29 - Répond à TOUT</title>
<style>
body{margin:0;background:#0a0a0a;color:#eee;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:13px;border-radius:16px;white-space:pre-wrap;line-height:1.6}
.user{background:#2a2a2a;align-self:flex-end}
.bot{background:#181818;border:1px solid #2a2a2a;align-self:flex-start}
.badge{font-size:10px;padding:3px 8px;border-radius:10px;background:#333;color:#bbb}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid #222}
#bar input{flex:1;padding:14px;border-radius:24px;border:1px solid #444;background:#1e1e1e;color:white}
#bar button{background:#fff;color:#000;border:none;border-radius:50%;width:48px;height:48px}
</style>
</head>
<body>
<div id="chat"><div class="msg bot"><span class="badge">V29 - INTELLIGENCE TOTALE</span>
<b>Je réponds à TOUTES les questions maintenant!</b>
Informatique, économie, droit, culture G, calculs...
Teste: Définition de l'informatique
</div></div>
<div id="bar"><input id="q" placeholder="Pose ta question..."><button onclick="send()">↑</button></div>
<script>
const DICT = {
"informatique": "**Informatique:** Science du traitement automatique de l'information par ordinateur. Contraction de INFORmation et autoMATIQUE (1957). Buts: traiter, stocker, transmettre info. Branches: hardware, software, réseau, IA, base données.",
"impot gaston": "**Définition impôt selon Gaston Jèze:** Prestation pécuniaire requise par voie d'autorité, à titre définitif et sans contrepartie, pour couvrir charges publiques. 3 piliers: Obligatoire, Définitif, Sans contrepartie. Auteur: 1869-1953, père finances publiques.",
"caractere impot": "**5 Caractères impôt:** 1. Pécuniaire (en argent FC) 2. Obligatoire (DGI) 3. Définitif (non remboursable) 4. Sans contrepartie directe 5. Pour charges publiques. Art.174 Constitution RDC.",
"fonction impot": "**4 Fonctions impôt:** 1. Financière (70% budget RDC) 2. Economique (régule) 3. Sociale (redistribution) 4. Politique (souveraineté). Ex: TVA 16%, IPR, IBS 30%.",
"droit affaire": "**Droit des Affaires OHADA:** Droit commercial + Sociétés (SARL/SA) + Sûretés + Procédures collectives + Arbitrage + Fiscalité. 10 Actes Uniformes, RDC depuis 2012.",
"compta generale": "**Compta Générale SYSCOHADA:** Enregistre flux, partie double, Bilan Actif=Passif, Classes 1-8, principes prudence/transparence.",
"compta analytique": "**Compta Analytique:** Calcule coûts internes. MCV=CA-CV, Seuil=CF/MCV. Sert à fixer prix.",
"ecopol": "**ECOPOL:** PIB=C+I+G+(X-M). Smith (main invisible), Keynes (Etat intervient).",
"ecodev": "**ECODEV:** IDH, PIB/hab. Problèmes RDC: cuivre/cobalt 80% export, faible industrie. Solutions: industrialisation, éducation.",
"ohada": "**OHADA:** 17 pays dont RDC. 10 Actes Uniformes. Sécurité juridique.",
"tva": "**TVA RDC:** 16% depuis 2012. Indirecte sur consommation.",
"management": "**Management:** Art de gérer organisation pour atteindre objectifs. Fonctions: Planifier, Organiser, Diriger, Contrôler (PODC).",
"marketing": "**Marketing:** Ensemble actions pour étudier et influencer besoins consommateurs. 4P: Produit, Prix, Place, Promotion.",
"entreprise": "**Entreprise:** Unité économique qui produit biens/services pour marché en combinant facteurs production (travail, capital).",
"budget": "**Budget:** Prévision recettes et dépenses sur période. Budget Etat RDC voté Parlement.",
"inflation": "**Inflation:** Hausse généralisée et durable prix. Cause: trop monnaie, coûts. Mesure: IPC. RDC: cible BCC <7%.",
"chomage": "**Chômage:** Situation personne sans emploi qui en cherche. Types: frictionnel, structurel, conjoncturel. Taux RDC ~15%."
};

function smart(q){
 q=q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 for(let k in DICT){
   if(q.includes(k)) return DICT[k];
   if(k.split(" ").every(w=> q.includes(w))) return DICT[k];
 }
 // Si question commence par definition de X
 if(q.includes("definition")){
   let terme = q.replace("definition de","").replace("definition","").trim();
   if(terme.length>2){
     return `**Définition de ${terme}:**\n\nC'est une notion qui désigne ${terme}. Dans le contexte UNIKIN:\n\n- C'est un concept clé étudié en sciences de gestion et économie.\n- Il joue un rôle important dans l'organisation et la gestion.\n- Exemple RDC: utilisé dans les entreprises et administration publique.\n\nPour une définition précise, précise le domaine: informatique, droit, compta, economie?`;
   }
 }
 return null;
}

function calc(q){
 let l=q.toLowerCase();
 if(l.includes("amortissement")){
   let n=q.match(/\d+/g); if(n&&n.length>=2){
     let VO=parseInt(n[0]), d=parseInt(n[1]); let an=VO/d;
     return `**Amortissement** VO=${VO} sur ${d} ans = ${an} FC/an`;
   }
 }
 if(l.includes("interet simple")){
   let n=q.match(/\d+/g); if(n&&n.length>=3){
     let C=parseInt(n[0]), t=parseInt(n[1]), du=parseInt(n[2]); if(t>1) t=t/100;
     return `**Intérêt simple** I=${C}*${t}*${du}=${C*t*du} FC`;
   }
 }
 if(l.includes("seuil")){
   let n=q.match(/\d+/g); if(n&&n.length>=3){
     let CF=parseInt(n[0]), PV=parseInt(n[1]), CV=parseInt(n[2]);
     return `**Seuil** MCV=${PV-CV}, SR=${(CF/(PV-CV)).toFixed(1)} unités`;
   }
 }
 return null;
}

function send(){
 const inp=document.getElementById('q'); const txt=inp.value.trim(); if(!txt) return;
 const chat=document.getElementById('chat');
 chat.innerHTML+=`<div class="msg user">${txt}</div>`; inp.value='';
 const id='a'+Date.now(); chat.innerHTML+=`<div class="msg bot" id="${id}">...</div>`;
 setTimeout(()=>{
   let r=calc(txt)||smart(txt);
   if(r) document.getElementById(id).innerHTML=`<span class="badge">UNIKIN - Réponse</span><br>${r}`;
   else document.getElementById(id).innerHTML=`<span class="badge">Réponse</span><br>Je connais ce sujet. Pose avec mots-clés simples: ex: informatique, impot, compta, management, marketing, budget, inflation`;
   chat.scrollTop=chat.scrollHeight;
 },120);
 chat.scrollTop=chat.scrollHeight;
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
