<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deo IA - Assistante personnelle Kinshasa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      margin-top: 5px;
      font-size: 14px;
      opacity: 0.8;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.5;
    }

    .bot {
      background: #eef2ff;
      align-self: flex-start;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      background: #111827;
      color: white;
      padding: 0 20px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 Deo IA</h1>
      <p>Votre assistante personnelle à Kinshasa</p>
    </header>

    <div id="chat">
      <div class="message bot">
        Bonjour 👋 Je suis <strong>Deo IA</strong>.<br>
        Comment puis-je vous aider aujourd'hui ?
      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Écrivez votre message..."
        onkeydown="if(event.key==='Enter') envoyerMessage()"
      >

      <button onclick="envoyerMessage()">Envoyer</button>
    </div>

  </div>

  <script>
    function envoyerMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (message === "") return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      const botMessage = document.createElement("div");
      botMessage.className = "message bot";
      botMessage.textContent =
        "Je suis encore en cours de connexion à mon intelligence artificielle 🤖. Nous allons maintenant connecter Deo IA à son cerveau.";

      chat.appendChild(botMessage);

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
  </html>
