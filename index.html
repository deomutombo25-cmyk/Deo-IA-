<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deo IA V35 - Bouton Réparé</title>
<style>
body{margin:0;background:#0a0a0a;color:#eee;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:14px;border-radius:18px;white-space:pre-wrap;line-height:1.7;font-size:14px;max-width:92%}
.user{background:#2a2a2a;align-self:flex-end}
.bot{background:#181818;border:1px solid #333;align-self:flex-start}
.badge{font-size:10px;padding:4px 10px;border-radius:12px;background:#00e676;color:#000;font-weight:bold}
#bar{display:flex;gap:8px;padding:12px;border-top:1px solid #222;align-items:center}
#bar input{flex:1;padding:15px;border-radius:24px;border:1px solid #555;background:#1e1e1e;color:white;outline:none}
#sendBtn{background:#fff;color:#000;border:none;border-radius:50%;width:50px;height:50px;font-size:20px;cursor:pointer}
#sendBtn:active{transform:scale(0.9)}
</style>
</head>
<body>
<div id="chat">
<div class="msg bot"><span class="badge">V35 - BOUTON RÉPARÉ ✅</span>
<b>Bouton envoi réparé!</b>

Maintenant tape et clique sur ↑ ça marche!

Teste: informatique, impôt gaston jeze, photosynthèse, Pythagore, TVA, OHADA, douane, marketing
</div>
</div>

<div id="bar">
<input id="q" type="text" placeholder="Tape ta question ici..." autocomplete="off">
<button id="sendBtn">↑</button>
</div>

<script>
const COURS = [
{ keys: ["informatique"], def: "**INFORMATIQUE - Définition claire:**\nScience du traitement automatique de l'information.\nINFORmation + autoMATIQUE (1962).\n\n2 parties:\n• Hardware: écran, clavier, unité centrale\n• Software: Windows, Word, Sage\n\nSert à gérer compta, élèves, impôts DGI en RDC." },
{ keys: ["impot","gaston","jeze"], def: "**IMPÔT selon Gaston Jèze:**\n> Prestation pécuniaire requise par voie d'autorité, à titre définitif et sans contrepartie, pour charges publiques.\n\nEn simple:\n• Tu payes en argent (FC)\n• Obligatoire (DGI force)\n• Définitif (pas remboursé)\n• Sans contrepartie directe\n• Pour routes, écoles, hôpitaux\n\nEx: TVA 16% sur crédit Vodacom." },
{ keys: ["caractere","impot"], def: "**5 CARACTÈRES Impôt:**\n1. Pécuniaire (en argent)\n2. Obligatoire (Art.174 Constitution)\n3. Définitif (pas remboursé)\n4. Sans contrepartie\n5. Pour charges publiques\n\nAstuce: PEC-OBL-DEF-SANS-CHAR" },
{ keys: ["tva"], def: "**TVA 16% RDC:**\nTaxe quand tu achètes. HT + 16% = TTC.\nEx: 1000 FC + 160 = 1160 FC TTC.\nCollectée par vendeur pour DGI." },
{ keys: ["ohada"], def: "**OHADA:** Mêmes lois commerciales pour 17 pays Afrique dont RDC depuis 2012. 10 Actes Uniformes. But: confiance investisseurs." },
{ keys: ["photosynthese"], def: "**PHOTOSYNTHÈSE:** Plantes fabriquent nourriture avec soleil.\n6CO2+6H2O+lumière -> Sucre+O2. Dans feuilles vertes (chlorophylle). Base vie." },
{ keys: ["pythagore"], def: "**PYTHAGORE:** Triangle rectangle c²=a²+b². Ex: 3-4-5 car 25=9+16. Sert à vérifier mur droit à Kinshasa." },
{ keys: ["cellule"], def: "**CELLULE:** Brique de base vie. Membrane, cytoplasme, noyau, mitochondrie (pile énergie). 37.000 milliards dans corps." },
{ keys: ["adn"], def: "**ADN:** Livre instructions dans chaque cellule. Double hélice A-T C-G. 46 chromosomes. Dit couleur yeux, taille." },
{ keys: ["compta"], def: "**COMPTABILITÉ:** Noter entrées/sorties argent entreprise. Partie double Débit/Crédit. Bilan, bénéfice = Produits - Charges. Logiciel Sage." },
{ keys: ["marketing"], def: "**MARKETING 4P:** Produit, Prix, Place (Gambela), Promotion (pub). But comprendre client et vendre." },
{ keys: ["douane"], def: "**DOUANE DGDA:** Police marchandises à Matadi. Fait payer 5-20% + TVA 16%, lutte fraude." },
{ keys: ["incoterms"], def: "**INCOTERMS:** 11 mots qui disent qui paye quoi import. RDC: FOB (au port), CIF (bateau+assurance)." },
{ keys: ["bureautique"], def: "**BUREAUTIQUE:** Travail bureau avec ordi: Word, Excel, PowerPoint. Essentiel secrétaire ISC." },
{ keys: ["algorithme"], def: "**ALGORITHME:** Recette pour ordi. Étapes précises: début -> instructions -> fin. Ex: calcul moyenne notes." }
];

function findDef(q){
 q=q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 let best=null, scoreMax=0;
 for(let c of COURS){
   let score=0;
   for(let k of c.keys){ if(q.includes(k)) score+=2; }
   if(score>scoreMax){ scoreMax=score; best=c; }
 }
 return best ? best.def : null;
}

function addMsg(text, who){
 const chat=document.getElementById('chat');
 const div=document.createElement('div');
 div.className='msg '+who;
 div.textContent=text;
 if(who==='bot'){
   // permet le gras ** **
   let html=text.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
   div.innerHTML=(who==='bot'?'<span class="badge">V35 - Réponse</span><br>':'')+html;
 } else {
   div.textContent=text;
 }
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function addBotHTML(html){
 const chat=document.getElementById('chat');
 const div=document.createElement('div');
 div.className='msg bot';
 div.innerHTML='<span class="badge">V35 - Réponse</span><br>'+html.replace(/\n/g,'<br>');
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function send(){
 const inp=document.getElementById('q');
 const txt=inp.value.trim();
 if(!txt) return;
 addMsg(txt,'user');
 inp.value='';
 
 let def=findDef(txt);
 setTimeout(()=>{
   if(def){
     addBotHTML(def.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>'));
   } else {
     addBotHTML('Je connais: informatique, impôt gaston jeze, caractères impôt, TVA, OHADA, photosynthèse, Pythagore, cellule, ADN, compta, marketing, douane, incoterms, bureautique, algorithme.<br><br>Tape juste le mot clé!');
   }
 }, 80);
}

// Répare bouton - 2 méthodes pour être sûr que ça marche sur mobile
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('q').addEventListener('keydown', function(e){
 if(e.key==='Enter'){ e.preventDefault(); send(); }
});
document.getElementById('q').addEventListener('focus', function(){ setTimeout(()=>{window.scrollTo(0,0);},300); });

console.log('V35 bouton réparé chargé');
</script>
</body>
  </html>
