<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deo IA V53 - VRAIE IA</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
#h{background:#111;padding:12px;border-bottom:2px solid #0f0;text-align:center}
#h h1{margin:0;font-size:19px;color:#0f0}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{padding:11px;border-radius:14px;max-width:85%;line-height:1.4;white-space:pre-wrap}
.user{background:#0a2a0a;align-self:flex-end;border:1px solid #0f0}
.ai{background:#1a1a1a;align-self:flex-start;border:1px solid #333}
#bar{display:flex;padding:8px;background:#111;gap:5px}
#inp{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff}
#send{background:#0f0;color:#000;border:none;padding:0 20px;border-radius:20px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div id="h"><h1>Deo IA V53 - VRAIE IA MONDIALE GRATUITE</h1></div>
<div id="chat"><div class="m ai">Salut Deo ! 🚀 V53 est là, 100% gratuite, sans inscription, sans clé. Pose ta question !</div></div>
<div id="bar"><input id="inp" placeholder="Pose ta question..."><button id="send">►</button></div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), send=document.getElementById('send');
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function ask(){
let q=inp.value.trim();if(!q)return;
add(q,'user');inp.value='';
let a=add('Deo IA réfléchit...','ai');
try{
let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q));
let t=await r.text();
a.textContent=t;
}catch(e){
a.textContent='Erreur réseau Deo, réessaie: '+e;
}
chat.scrollTop=chat.scrollHeight;
}
send.onclick=ask;
inp.onkeydown=e=>{if(e.key==='Enter')ask()};
</script>
</body>
</html>
