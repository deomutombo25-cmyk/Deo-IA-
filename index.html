{ keys: ["informatique","info"], def: "**INFORMATIQUE - Définition claire:**\nScience qui permet de traiter automatiquement l'information avec un ordinateur.\n\n**Origine:** INFORmation + autoMATIQUE (1962, Philippe Dreyfus).\n\n**2 parties:**\n• Hardware = parties qu'on touche (écran, clavier, unité centrale)\n• Software = programmes (Windows, Word, Sage)\n\n**À quoi ça sert en RDC?** Gérer les élèves d'une école, la compta d'une boutique à Kinshasa, les impôts à la DGI.\n\n**Exemple simple:** Quand tu tapes un texte dans Word, c'est l'informatique qui le traite." },
{ keys: ["impot","gaston","jeze","jèze"], def: "**IMPÔT selon Gaston Jèze - Définition claire:**\nC'est une somme d'argent que l'Etat oblige tout le monde à payer pour faire fonctionner le pays.\n\n**Selon Gaston Jèze (prof français 1869-1953):**\n> \"Prestation pécuniaire requise par voie d'autorité, à titre définitif et sans contrepartie, en vue de couvrir les charges publiques.\"\n\n**En français simple:**\n• Prestation pécuniaire = tu payes en argent (FC)\n• Par voie d'autorité = c'est obligatoire, DGI te force\n• Définitif = on ne te rembourse pas\n• Sans contrepartie = tu ne reçois pas directement quelque chose en retour\n• Charges publiques = pour construire routes, écoles, hôpitaux\n\n**Exemple RDC:** TVA 16% quand tu achètes crédit Vodacom." },
{ keys: ["caractere","caractère","impot"], def: "**5 CARACTÈRES de l'Impôt - Explication claire:**\n\n1. **Pécuniaire:** On paye en argent, pas en poule. Ex: 16.000 FC\n2. **Obligatoire:** DGI peut te poursuivre si tu ne payes pas. Art.174 Constitution RDC\n3. **Définitif:** L'argent ne revient pas. Pas comme une caution\n4. **Sans contrepartie directe:** Tu payes même si la route devant chez toi est trouée\n5. **Pour charges publiques:** L'argent sert à tous les Congolais\n\n**Astuce examen:** Retiens PEC-OBL-DEF-SANS-CHAR" },
{ keys: ["fonction","impot"], def: "**4 FONCTIONS de l'Impôt - Clair:**\n\n1. **Financière (la plus importante):** Remplir la caisse de l'Etat. 70% du budget RDC vient des impôts\n2. **Économique:** L'Etat augmente ou baisse les impôts pour aider l'économie. Ex: baisse impôt pour entreprises qui créent emplois\n3. **Sociale:** Prendre aux riches pour aider les pauvres (redistribution). Ex: IPR progressif\n4. **Politique:** Montrer que l'Etat est puissant et souverain" },
{ keys: ["tva"], def: "**TVA - Définition claire:**\nTaxe sur la Valeur Ajoutée. C'est l'impôt que tu payes chaque fois que tu achètes quelque chose.\n\n**Taux RDC:** 16% depuis 2012\n**Comment calculer:** Si pain = 1000 FC HT, TVA = 160 FC, tu payes 1160 FC TTC\n**Qui collecte?** Le vendeur (boutique) collecte pour la DGI\n**Pourquoi?** Impôt facile à collecter, rapporte beaucoup à l'Etat" },
{ keys: ["ohada"], def: "**OHADA - Définition claire:**\nOrganisation qui a créé les mêmes lois commerciales pour 17 pays d'Afrique dont la RDC.\n\n**But:** Un investisseur à Dakar et à Kinshasa trouve les mêmes règles = confiance\n**Depuis quand RDC?** 2012\n**10 Actes Uniformes:** Droit commercial, Sociétés (SARL, SA), Sûretés, Procédures collectives, etc.\n**Cour:** Abidjan" },
{ keys: ["photosynthese","photosynthèse"], def: "**PHOTOSYNTHÈSE - Définition claire (Biologie):**\nC'est comment les plantes fabriquent leur nourriture avec le soleil.\n\n**Formule simple:** Soleil + CO2 (air) + Eau -> Sucre + Oxygène\n**Où?** Dans les feuilles vertes, grâce à la chlorophylle (couleur verte)\n**Pourquoi important?** Sans ça, pas d'oxygène pour respirer, pas de nourriture. C'est la base de la vie.\n**Exemple RDC:** Manioc, maïs à Masina font photosynthèse" },
{ keys: ["pythagore"], def: "**THÉORÈME PYTHAGORE - Définition claire (Maths):**\nDans un triangle avec un angle droit (90°), le grand côté (hypoténuse) au carré = somme des 2 petits côtés au carré.\n\n**Formule:** c² = a² + b²\n**Exemple le plus connu:** Triangle 3,4,5 car 5²=3²+4² (25=9+16)\n**À quoi ça sert à Kinshasa?** Vérifier si un mur est bien droit quand on construit maison" },
{ keys: ["cellule"], def: "**CELLULE - Définition claire (Biologie):**\nC'est la plus petite brique qui compose tous les êtres vivants. Ton corps a 37.000 milliards de cellules!\n\n**Parties:** Membrane (peau), Cytoplasme (intérieur), Noyau (cerveau qui commande), Mitochondrie (pile qui donne énergie)\n**2 types:** Procaryote (bactérie, sans noyau) et Eucaryote (humain, avec noyau)" },
{ keys: ["adn"], def: "**ADN - Définition claire:**\nC'est le livre d'instructions qui est dans chaque cellule de ton corps. Il dit si tu auras yeux noirs, taille grande.\n\n**Forme:** Double hélice (escalier en colimaçon)\n**Lettres:** A-T, C-G qui s'assemblent\n**Humain:** 46 chromosomes (23 de papa, 23 de maman)\n**Où?** Dans noyau cellule" },
{ keys: ["compta","comptabilite","comptabilité"], def: "**COMPTABILITÉ - Définition claire (ISC/UNIKIN):**\nC'est noter tout l'argent qui entre et sort d'une entreprise pour savoir si elle gagne ou perd.\n\n**Principe:** Partie double - chaque opération a 2 côtés: Débit et Crédit\n**Documents:** Facture, Journal, Bilan (photo de ce que l'entreprise possède et doit)\n**But:** Savoir bénéfice = Produits - Charges\n**Logiciels:** Sage, SAP utilisés à Kinshasa" },
{ keys: ["marketing"], def: "**MARKETING - Définition claire:**\nC'est tout ce qu'on fait pour comprendre ce que les clients veulent et leur vendre.\n\n**4P à retenir (Mix Marketing):**\n• Produit: qu'est-ce que je vends? (ex: jus sucré)\n• Prix: combien? (1000 FC)\n• Place: où je vends? (marché Gambela, boutique)\n• Promotion: comment je fais connaître? (affiche, Facebook)\n\n**Exemple RDC:** Vodacom fait marketing avec pub \"Meilleur réseau\"" },
{ keys: ["douane","dgda"], def: "**DOUANE (DGDA) - Définition claire:**\nC'est la police des frontières pour les marchandises. Quand un container arrive à Matadi, la douane vérifie et fait payer taxes.\n\n**Rôles:**\n1. Faire payer droits (5-20% + TVA 16%)\n2. Protéger entreprises locales\n3. Lutter contre fraude (drogue, faux médicaments)\n**Document:** Déclaration douanière" },
{ keys: ["incoterms"], def: "**INCOTERMS - Définition claire:**\nCe sont 11 mots courts qui disent qui paye quoi quand on achète à l'étranger.\n\n**Les plus utilisés RDC:**\n• FOB: vendeur amène au port Matadi, toi tu payes bateau\n• CIF: vendeur paye bateau + assurance jusqu'à Matadi\n**But:** Éviter disputes entre vendeur Chine et acheteur Kinshasa" },
