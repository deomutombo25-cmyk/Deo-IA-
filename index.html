<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deo IA V3 - Vraie IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:white;height:100vh;display:flex;flex-direction:column}
header{background:#1e293b;padding:14px;text-align:center;border-bottom:1px solid #334155}
header h1{font-size:22px} header p{font-size:13px;opacity:.7}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 15px;border-radius:18px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:#3b82f6;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#1e293b;border:1px solid #334155;border-bottom-left-radius:4px}
.typing{opacity:.6;font-style:italic}
.bar{background:#1e293b;padding:12px;display:flex;gap:8px;border-top:1px solid #334155}
#input{flex:1;padding:13px 18px;border-radius:25px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
#send{background:#3b82f6;border:none;padding:12px 18px;border-radius:25px;color:white;font-weight:bold}
</style>
</head>
<body>
<header><h1>🤖 Deo IA V3</h1><p>Intelligence de Kinshasa - Pose tout</p></header>
<div id="chat"><div class="msg bot">Mbote Deo! Je suis maintenant une vraie IA 🧠 Pose ta question sur Gaston Jèze, l'impôt, tout!</div></div>
<div class="bar"><input id="input" placeholder="Définition impôt selon Gaston Jèze" onkeypress="if(event.key==='Enter')send()"><button id="send" onclick="send()">Envoyer</button></div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('input'), btn=document.getElementById('send');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function send(){
 let q=inp.value.trim(); if(!q) return;
 add(q,'user'); inp.value=''; btn.disabled=true;
 let loading=add('Deo IA réfléchit... ⏳','bot typing');
 try{
   let prompt=encodeURIComponent(`Tu es Deo IA, créée par Deo à Kinshasa. Réponds en français simple. Question: ${q}`);
   let res=await fetch(`https://text.pollinations.ai/${prompt}?model=openai`);
   let text=await res.text();
   loading.remove();
   add(text,'bot');
 }catch(e){
   loading.remove();
   add("Connexion faible. Réessaie. Ta question était: "+q,"bot");
 }
 btn.disabled=false;
}
</script>
</body>
</html>
