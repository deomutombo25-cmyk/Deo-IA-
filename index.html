<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deo IA V5 Live Monde</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121f44">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080e1f;color:#fff;height:100vh;display:flex;flex-direction:column;font-family:sans-serif}
header{background:#121f44;padding:10px;text-align:center}
.live{background:#000;color:#4ade80;padding:3px 8px;border-radius:10px;font-size:12px}
#menu{display:flex;gap:5px;overflow:auto;padding:8px;background:#0f1a33}
#menu button{padding:6px 10px;border-radius:15px;border:none;background:#1e2f5a;color:#fff;white-space:nowrap}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;line-height:1.4;font-size:14px}
.user{align-self:flex-end;background:#2563eb}
.bot{align-self:flex-start;background:#1e293b;border:1px solid #334155}
.bar{background:#121f44;padding:8px;display:flex;gap:6px}
input{flex:1;padding:10px;border-radius:20px;border:none;outline:none}
button.send{background:#2563eb;color:#fff;border:none;padding:10px 16px;border-radius:20px}
</style>
</head>
<body>
<header><b>Deo IA V5</b> <span class="live">🔴 LIVE OCT 2026</span><br><small>IA Mondiale - RDC / Mines / Emploi ONEM</small></header>
<div id="menu">
<button onclick="ask('Guerre RDC Est Rubaya aujourd’hui')">Guerre RDC</button>
<button onclick="ask('Contrats miniers RDC USA Chine')">Contrats</button>
<button onclick="ask('Nombre de mineurs dans le monde')">Mineurs</button>
<button onclick="ask('Offres emploi ONEM aujourd’hui RDC')">Emploi RDC</button>
<button onclick="ask('Qui est Deo Mutombo Gaston?')">Gaston</button>
</div>
<div id="chat"><div class="msg bot">Mbote Deo ! V5 Monde Live est prêt 🌍<br><br>Je connais:<br>• Guerres RDC, Ukraine, Gaza<br>• Contrats miniers USA-Chine<br>• ONEM.cd + Mikuba<br>• Tes cours<br><br>Pose ta question !</div></div>
<div class="bar"><input id="q" placeholder="Pose ta question..."><button class="send" onclick="send()">Envoyer</button></div>
<script>
const chat=document.getElementById('chat');
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function ask(t){document.getElementById('q').value=t;send()}
async function send(){const i=document.getElementById('q');let q=i.value.trim();if(!q)return;add(q,'user');i.value='';add('Recherche live...','bot');const data=`Deo Mutombo, étudiant ISC Kinshasa. Question: ${q}. Réponds en français court. Si emploi, cite ONEM.cd et app Mikuba. Si guerre RDC, cite Rubaya, M23, AFC. Si contrats, cite USA 2025, Lobito. Si Gaston, c'est son surnom. Date: Oct 2026.`;try{let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://text.pollinations.ai/'+encodeURIComponent(data)));let t=await r.text();chat.lastChild.remove();add(t.replace(/\n/g,'<br>'),'bot')}catch(e){chat.lastChild.remove();add('Erreur réseau, réessaie.','bot')}}
</script>
</body>
 </html>
