<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deo IA V43 - Comptabilité OHADA</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
#h{background:#111;border-bottom:2px solid #00e676;padding:12px;text-align:center}
#h h1{margin:0;font-size:22px} #h h1 span{color:#00e676}
#h p{margin:4px 0 0;color:#aaa;font-size:12px}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{padding:11px;border-radius:14px;max-width:85%;line-height:1.4;white-space:pre-wrap}
.u{background:#2a2a2a;align-self:flex-end}
.b{background:#1a1a1a;border:1px solid #333;align-self:flex-start}
.bdg{background:#00e676;color:#000;font-size:11px;padding:2px 6px;border-radius:6px;font-weight:bold}
#bar{display:flex;gap:7px;padding:10px;background:#111;border-top:1px solid #222}
#q{flex:1;padding:13px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;outline:none}
#send{width:52px;height:52px;border-radius:12px;border:none;background:#00e676;font-weight:bold;cursor:pointer}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btns button{background:#222;border:1px solid #333;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div id="h">
<h1>Deo IA <span>V43</span></h1>
<p>Toutes Définitions + Comptabilité OHADA - Made in RDC</p>
</div>
<div id="chat"></div>
<div id="bar">
<input id="q" placeholder="Ex: marchandise 100$ tva 16% ou journal ou balance...">
<button id="send">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');

function addMsg(text, who){
 const d = document.createElement('div');
 d.className = 'm '+(who==='user'?'u':'b');
 d.textContent = text;
 chat.appendChild(d);
 chat.scrollTop = chat.scrollHeight;
}

function comptaEngine(txt){
 txt = txt.toLowerCase();
 // Détecte montant
 let m = txt.match(/(\d+)\s*\$?/);
 let montant = m ? parseFloat(m[1]) : 100;
 let tva = 0.16;
 let ttc = montant * 1.16;
 let tvaMont = montant * 0.16;

 if(txt.includes('ttc') && txt.includes('ht')){
   // si user donne TTC
   let ht = montant / 1.16;
   return `TTC: ${montant}$\nHT: ${ht.toFixed(2)}$\nTVA 16%: ${(montant-ht).toFixed(2)}$`;
 }
 if(txt.includes('journal')){
   return `JOURNAL OHADA - Achat ${montant}$ HT:\n\nDébit 601 Achat March: ${montant}$\nDébit 4452 TVA: ${tvaMont}$\nCrédit 401 Fournisseur: ${ttc}$\n\nVente:\nDébit 411 Client: ${ttc}$\nCrédit 701 Vente: ${montant}$\nCrédit 4431 TVA facturée: ${tvaMont}$`;
 }
 if(txt.includes('grand livre') || txt.includes('grands livres')){
   return `GRANDS LIVRES (T):\n\n601 - Solde Débiteur: ${montant}$\n4452 - Solde Débiteur: ${tvaMont}$\n401 - Solde Créditeur: ${ttc}$\n\nTotal Débit = Crédit: ${ttc}$ OK`;
 }
 if(txt.includes('balance')){
   return `BALANCE OHADA - ${montant}$ HT\n\nCompte | Mvt Débit | Mvt Crédit | Solde\n601 | ${montant} | 0 | ${montant} D\n4452 | ${tvaMont} | 0 | ${tvaMont} D\n401 | 0 | ${ttc} | ${ttc} C\n\nTotaux: ${ttc} = ${ttc} ✅ Équilibrée`;
 }
 // défaut: calcul TTC
 return `Marchandise: ${montant}$ HT\nTVA 16%: ${tvaMont}$\nTTC: ${ttc}$\n\nFormule: TTC = HT x 1,16\nHT = TTC / 1,16\n\nTape: 'journal', 'grands livres', 'balance' pour les écritures.`;
}

document.getElementById('send').onclick = () => {
 if(!q.value.trim()) return;
 let txt = q.value.trim();
 addMsg(txt,'user');
 setTimeout(()=>{
   let rep = comptaEngine(txt);
   if(txt.includes('mourinho') || txt.includes('real') || txt.includes('barça')){
     rep = "Mourinho: 'Estamos perdiendo 24 horas de reposo, pero ahí vamos.' = On perd 24h de repos, pas le match!";
   }
   addMsg(rep,'bot');
 },400);
 q.value='';
};
q.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('send').click(); });

addMsg("Mbote! Je suis Deo IA V43 🇨🇩\n\nTape:\n- '100$ tva' => calcul TTC\n- 'journal 100$' => écriture journal\n- 'grands livres' => T\n- 'balance' => balance OHADA\n\nTu es prêt?","bot");
</script>
</body>
</html>
