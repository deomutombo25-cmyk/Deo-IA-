<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Deo IA V20 ULTRA</title></head>
<body>
<script>
// C'EST LE CERVEAU PRÉCIS
const GROQ_KEY = "METS_TA_CLE_ICI"; // <-- Mets ta clé gsk_ ici
const SYSTEM_PROMPT = `
Tu es Deo IA V20 ULTRA, professeur expert UNIKIN L1 L2 L3 Droit et Economie.
Ta mission : Répondre avec PRÉCISION ABSOLUE, pas de blabla.

RÈGLES OBLIGATOIRES pour chaque réponse :
1. DÉFINITION PRÉCISE : 2 phrases max, claire.
2. BASE LÉGALE / SOURCE : Article, loi, OHADA, Code, livre exact.
3. COMPOSITION / ÉLÉMENTS : Si on demande "de quoi est composé", liste numérotée.
4. EXEMPLE CONCRET RDC.
5. Aucune invention. Si tu ne sais pas, dis "Je vérifie dans le livre".

Tu connais par cœur : Droit des affaires, Commercial, Civil, Pénal, Judiciaire, Travail, Minier, OHADA, Comptabilité, Economie, Fiscalité.

Style : Comme un prof qui corrige un examen. Précis, direct, utile.
`;

async function repondrePrecis(question){
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Authorization":"Bearer "+GROQ_KEY,"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"llama-3.3-70b-versatile",
      messages:[{role:"system",content:SYSTEM_PROMPT},{role:"user",content:question}],
      temperature:0.1
    })
  });
  const data = await res.json();
  return data.choices[0].message.content;
}
</script>

<!-- DESIGN CHATGPT -->
<div id="chat"></div>
<input id="q" placeholder="Pose ta question de cours..."><button onclick="send()">Envoyer</button>

<script>
async function send(){
  const question = document.getElementById('q').value;
  document.getElementById('chat').innerHTML += `<p><b>Toi:</b> ${question}</p><p id="load">🧠 Deo IA V20 analyse le livre...</p>`;
  const rep = await repondrePrecis(question);
  document.getElementById('load').remove();
  document.getElementById('chat').innerHTML += `<p><b>Deo IA V20:</b><br>${rep.replace(/\n/g,'<br>')}</p>`;
}
</script>
</body></html>
