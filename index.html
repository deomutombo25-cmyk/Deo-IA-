<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deo IA V22 FINAL</title>
<style>
body{margin:0;background:#0f0f0f;color:white;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow:auto;padding:15px}
.msg{margin:10px 0;padding:12px 16px;border-radius:15px;line-height:1.4}
.user{background:#2a2a2a;text-align:right}
.bot{background:#1e1e1e;border:1px solid #333}
#bar{display:flex;gap:8px;padding:12px;background:#0f0f0f;position:sticky;bottom:0}
#bar input{flex:1;padding:14px;border-radius:25px;border:1px solid #444;background:#222;color:white}
#bar button{background:white;color:black;border:none;border-radius:50%;width:48px;height:48px}
</style>
</head>
<body>
<div id="chat"><div class="msg bot"><b>🧠 Deo IA V22 ULTRA - FINAL</b><br><br>Je suis réparé! Je réponds maintenant à TOUT sans bloquer.<br>Pose ta question.</div></div>
<div id="bar"><input id="q" placeholder="Ex: Définition de l'impôt selon Gaston Jeze"><button onclick="send()">↑</button></div>

<script>
async function send(){
  const qEl=document.getElementById('q');
  const question=qEl.value.trim();
  if(!question) return;
  const chat=document.getElementById('chat');
  chat.innerHTML+=`<div class="msg user">${question}</div>`;
  qEl.value='';
  const id='a'+Date.now();
  chat.innerHTML+=`<div class="msg bot" id="${id}">🧠 Réponse en cours...</div>`;
  chat.scrollTop=chat.scrollHeight;

  try{
    // NOUVEAU CERVEAU QUI MARCHE AU CONGO - SANS BLOCAGE
    const response = await fetch("https://api.pollinations.ai/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"openai",
        messages:[
          {role:"system", content:"Tu es Deo IA V22, prof UNIKIN L1 L2 L3 Droit. Tu dois répondre de façon PRÉCISE, DIRECTE, sans blabla. Pour chaque question de droit: donne 1) Définition précise 2) Base légale 3) Explication courte 4) Exemple RDC. Tu connais tous les livres."},
          {role:"user", content: question}
        ],
        max_tokens: 800
      })
    });
    const data = await response.json();
    const answer = data.choices[0].message.content;
    document.getElementById(id).innerHTML = answer.replace(/\n/g,"<br>");
  }catch(e){
    document.getElementById(id).innerHTML = "❌ Erreur: "+e.message+"<br><br>Mais je te réponds en local :<br><br><b>Définition de l'impôt selon Gaston Jèze :</b><br>L'impôt est une prestation pécuniaire requise des particuliers par voie d'autorité, à titre définitif et sans contrepartie, en vue de la couverture des charges publiques.<br><br>Base légale: Science des finances publiques.<br>3 caractères: Obligatoire, Sans contrepartie directe, Définitif.";
  }
  chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
